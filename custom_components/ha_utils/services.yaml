set_font_scale:
  name: Set font scale
  description: >-
    Set the default Home Assistant theme font-size scale at runtime. Run from
    Settings > Developer tools > Actions.
  fields:
    scale:
      name: Font scale
      description: Runtime multiplier for Home Assistant font-size tokens.
      required: false
      default: 1.0
      example: 1.2
      selector:
        number:
          min: 0.5
          max: 2.5
          step: 0.05
          mode: box
