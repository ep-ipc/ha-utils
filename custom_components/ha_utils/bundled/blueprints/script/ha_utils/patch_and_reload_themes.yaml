blueprint:
  name: HA Utils — patch themes and reload
  description: >-
    Patch theme typography (ha-font-size-scale, Mushroom, card-mod) then reload
    themes. Requires the Home Assistant Utils integration.
  domain: script
  input:
    scale:
      name: Font scale
      description: ha-font-size-scale multiplier.
      default: 1.0
      selector:
        number:
          min: 0.5
          max: 2.5
          step: 0.05
    line_height:
      name: Line height
      description: ha-line-height-normal value.
      default: 1.8
      selector:
        number:
          min: 1.0
          max: 3.0
          step: 0.1
    dry_run:
      name: Dry run
      description: Preview without writing theme files.
      default: false
      selector:
        boolean:
  source_url: https://github.com/parthkheni/ha-utils

sequence:
  - action: ha_utils.patch_themes
    data:
      scale: !input scale
      line_height: !input line_height
      dry_run: !input dry_run
  - action: ha_utils.reload_themes
