blueprint:
  name: HA Utils - Hot day alert
  description: >
    Run actions when a temperature sensor rises above a configurable threshold.
    Use this for heat alerts, closing blinds, adjusting climate schedules, or
    notifying household members.
  domain: automation
  source_url: https://github.com/ep-ipc/ha-utils
  input:
    temperature_sensor:
      name: Temperature sensor
      description: Sensor that reports the outdoor or target temperature.
      selector:
        entity:
          domain: sensor
    temperature_threshold:
      name: High temperature threshold
      description: Trigger when temperature rises above this value.
      default: 90
      selector:
        number:
          min: -50
          max: 150
          step: 1
          mode: box
    hold_duration:
      name: Hold duration
      description: How long the temperature must remain above the threshold.
      default:
        minutes: 15
      selector:
        duration:
    cooldown:
      name: Cooldown
      description: Minimum time between automation runs.
      default:
        hours: 4
      selector:
        duration:
    actions:
      name: Actions
      description: Actions to run when a hot day is detected.
      selector:
        action:

mode: single
max_exceeded: silent

trigger:
  - platform: numeric_state
    entity_id: !input temperature_sensor
    above: !input temperature_threshold
    for: !input hold_duration

condition:
  - condition: template
    value_template: >
      {{ this.attributes.last_triggered is none
         or now() - this.attributes.last_triggered >= timedelta(**cooldown) }}

variables:
  cooldown: !input cooldown
  temperature_sensor: !input temperature_sensor
  temperature_threshold: !input temperature_threshold
  temperature: "{{ states(temperature_sensor) }}"

action: !input actions
