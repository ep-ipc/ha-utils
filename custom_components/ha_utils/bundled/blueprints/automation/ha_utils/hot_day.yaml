blueprint:
  name: HA Utils - Hot day alert
  description: >
    Run actions when a weather entity reports temperature above a configurable threshold.
    Temperature uses the same unit as the weather entity (your Home Assistant unit system
    in Settings → System → General, or the entity's configured unit).
    Use this for heat alerts, closing blinds, adjusting climate schedules, or
    notifying household members.
  domain: automation
  source_url: https://github.com/ep-ipc/ha-utils
  input:
    weather_entity:
      name: Weather entity
      description: Weather entity that provides a temperature attribute.
      selector:
        entity:
          domain: weather
    temperature_threshold:
      name: High temperature threshold
      description: >
        Trigger when temperature rises above this value, in the same unit as the
        weather entity's temperature (Settings → System → General, or the entity's unit).
      selector:
        number:
          min: -50
          max: 150
          step: 1
          mode: box
    hold_duration:
      name: Hold duration
      description: How long the temperature must remain above the threshold.
      default:
        minutes: 15
      selector:
        duration:
    cooldown:
      name: Cooldown
      description: Minimum time between automation runs.
      default:
        hours: 4
      selector:
        duration:
    actions:
      name: Actions
      description: Actions to run when a hot day is detected.
      selector:
        action:

mode: single
max_exceeded: silent

trigger:
  - platform: numeric_state
    entity_id: !input weather_entity
    attribute: temperature
    above: !input temperature_threshold
    for: !input hold_duration

condition:
  - condition: template
    value_template: >
      {{ this.attributes.last_triggered is none
         or now() - this.attributes.last_triggered >= timedelta(**cooldown) }}

variables:
  cooldown: !input cooldown
  weather_entity: !input weather_entity
  temperature_threshold: !input temperature_threshold
  temperature: "{{ state_attr(weather_entity, 'temperature') }}"

action: !input actions
