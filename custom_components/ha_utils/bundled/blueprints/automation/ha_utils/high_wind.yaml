blueprint:
  name: HA Utils - High wind alert
  description: >
    Run actions when a weather entity reports wind speed above a configurable threshold.
    Use this for notifications, closing covers, securing outdoor devices, or
    pausing outdoor automations.
  domain: automation
  source_url: https://github.com/ep-ipc/ha-utils
  input:
    weather_entity:
      name: Weather entity
      description: Weather entity that provides a wind_speed attribute.
      selector:
        entity:
          domain: weather
    wind_speed_threshold:
      name: Wind speed threshold
      description: Trigger when wind speed rises above this value.
      default: 30
      selector:
        number:
          min: 0
          max: 150
          step: 1
          mode: box
    hold_duration:
      name: Hold duration
      description: How long the wind speed must remain above the threshold.
      default:
        minutes: 5
      selector:
        duration:
    cooldown:
      name: Cooldown
      description: Minimum time between automation runs.
      default:
        hours: 1
      selector:
        duration:
    actions:
      name: Actions
      description: Actions to run when high wind is detected.
      selector:
        action:

mode: single
max_exceeded: silent

trigger:
  - platform: numeric_state
    entity_id: !input weather_entity
    attribute: wind_speed
    above: !input wind_speed_threshold
    for: !input hold_duration

condition:
  - condition: template
    value_template: >
      {{ this.attributes.last_triggered is none
         or now() - this.attributes.last_triggered >= timedelta(**cooldown) }}

variables:
  cooldown: !input cooldown
  weather_entity: !input weather_entity
  wind_speed_threshold: !input wind_speed_threshold
  wind_speed: "{{ state_attr(weather_entity, 'wind_speed') }}"

action: !input actions
