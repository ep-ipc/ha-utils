blueprint:
  name: HA Utils - Possible thunderstorm alert
  description: >
    Run actions when a weather entity changes to a storm-like condition. Use
    this for notifications, closing covers, pausing irrigation, or securing
    outdoor devices.
  domain: automation
  source_url: https://github.com/ep-ipc/ha-utils
  input:
    weather_entity:
      name: Weather entity
      description: Weather entity to monitor for storm-like states.
      selector:
        entity:
          domain: weather
    storm_conditions:
      name: Storm-like conditions
      description: Weather states that should be treated as possible storms.
      default:
        - lightning
        - lightning-rainy
        - pouring
        - rainy
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - lightning
            - lightning-rainy
            - pouring
            - rainy
            - hail
            - windy
            - windy-variant
    cooldown:
      name: Cooldown
      description: Minimum time between automation runs.
      default:
        hours: 1
      selector:
        duration:
    actions:
      name: Actions
      description: Actions to run when a possible thunderstorm is detected.
      selector:
        action:

mode: single
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input weather_entity

condition:
  - condition: template
    value_template: >
      {{ trigger.to_state is not none
         and trigger.to_state.state in storm_conditions
         and (
           this.attributes.last_triggered is none
           or now() - this.attributes.last_triggered >= timedelta(**cooldown)
         ) }}

variables:
  cooldown: !input cooldown
  storm_conditions: !input storm_conditions
  weather_entity: !input weather_entity
  weather_condition: "{{ states(weather_entity) }}"

action: !input actions
